name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same pull request (or branch) cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        run: npm run release:preflight

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify fresh cached plugin startup
        id: cold-install
        env:
          PLANBAN_COLD_INSTALL_DIAGNOSTICS_DIR: ${{ runner.temp }}/planban-cold-install-diagnostics
        run: node scripts/verify-cold-install.mjs

      - name: Upload cold startup failure diagnostics
        if: failure() && steps.cold-install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-cold-install-diagnostics
          path: ${{ runner.temp }}/planban-cold-install-diagnostics/cold-install-npm-events.json
          if-no-files-found: ignore
          retention-days: 3
