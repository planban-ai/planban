name: Updater rehearsal

permissions:
  contents: read

on:
  pull_request:
    # The seven-machine rehearsal runs when a pull request opens, reopens or becomes
    # ready. A later push runs only the quick compatibility checks (and cancels any
    # rehearsal still going). Rerun it by hand, and Release readiness runs it on the
    # exact release commit. See CONTRIBUTING.md.
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - ".github/workflows/updater-rehearsal.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/assert-update-performance.mjs"
      - "scripts/platform-invocation.mjs"
      - "plugins/planban/scripts/**"
      - "scripts/platform-invocation.d.mts"
      - "scripts/rehearse-marketplace-update-performance.mjs"
      - "scripts/rehearse-claude-code-upgrade.mjs"
      - "scripts/rehearsal-retry.mjs"
      - "scripts/marketplace-rehearsal-config.mjs"
      - "tests/marketplace-rehearsal-config.test.ts"
      - "scripts/update-marketplace-runtime.mjs"
      - "src/core/updateRunner.ts"
      - "tests/update-marketplace-runtime.test.ts"
      - "tests/update-performance-assertion.test.ts"
      - "tests/platform-invocation.test.ts"
  workflow_dispatch:
    inputs:
      from_version:
        description: Public Planban version used as the old marketplace
        required: true
        default: "1.1.6"
        type: string
      target_ref:
        description: Remote branch or tag containing the exact candidate
        required: true
        type: string
      expected_commit:
        description: Exact commit the marketplace must install
        required: true
        type: string
  workflow_call:
    inputs:
      from_version:
        description: Public Planban version used as the old marketplace
        required: true
        type: string
      target_ref:
        description: Remote branch or tag containing the exact candidate
        required: true
        type: string
      expected_commit:
        description: Exact commit the marketplace must install
        required: true
        type: string

# A newer push cancels a rehearsal of an older commit. The rehearsal fetches the branch
# by name, as people update, so a run outlived by a push would install the newer commit
# and fail. Runs are grouped by the branch under test, so a push also cancels a
# rehearsal started by hand or by Release readiness on that branch.
concurrency:
  group: updater-rehearsal-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  marketplace-update:
    name: Marketplace update (${{ matrix.os }}, shard ${{ matrix.shard }})
    # Not on later pushes to a pull request: see the triggers above.
    if: github.event_name != 'pull_request' || github.event.action != 'synchronize'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: 1, iterations: 5 }
          - { os: macos-latest, shard: 1, iterations: 5 }
          - { os: windows-latest, shard: 1, iterations: 1 }
          - { os: windows-latest, shard: 2, iterations: 1 }
          - { os: windows-latest, shard: 3, iterations: 1 }
          - { os: windows-latest, shard: 4, iterations: 1 }
          - { os: windows-latest, shard: 5, iterations: 1 }
    runs-on: ${{ matrix.os }}
    env:
      FROM_VERSION: ${{ inputs.from_version || '1.1.6' }}
      TARGET_REF: ${{ inputs.target_ref || github.event.pull_request.head.ref }}
      RELEASE_SOURCE_URL: https://github.com/${{ github.repository }}.git
      TARGET_SOURCE_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.150.1

      - name: Run focused cross-platform fallback tests
        run: node --test --import tsx/esm tests/platform-invocation.test.ts tests/marketplace-rehearsal-config.test.ts tests/update-marketplace-runtime.test.ts tests/update-performance-assertion.test.ts

      - name: Rehearse the previous public version upgrade
        if: matrix.shard == 1
        shell: bash
        run: |
          node scripts/rehearse-marketplace-update-performance.mjs --from-version "$FROM_VERSION" --source-url "$RELEASE_SOURCE_URL" --target-source-url "$TARGET_SOURCE_URL" --target-ref "$TARGET_REF" --expected-commit "$EXPECTED_COMMIT" --iterations 1 --mode both > upgrade-correctness.json
          node scripts/assert-update-performance.mjs --file upgrade-correctness.json --expected-commit "$EXPECTED_COMMIT" --iterations 1 --correctness-only

      - name: Run clean and reuse marketplace update samples
        run: >-
          node scripts/rehearse-marketplace-update-performance.mjs
          --from-ref "$TARGET_REF"
          --source-url "$TARGET_SOURCE_URL"
          --target-ref "$TARGET_REF"
          --expected-commit "$EXPECTED_COMMIT"
          --iterations ${{ matrix.iterations }}
          --shard-id ${{ matrix.shard }}
          --mode both
          > update-performance.json
        shell: bash

      - name: Enforce correctness and relative speed gate
        if: matrix.os != 'windows-latest'
        run: >-
          node scripts/assert-update-performance.mjs
          --file update-performance.json
          --expected-commit "$EXPECTED_COMMIT"
          --iterations 5
          --minimum-improvement 0.2
        shell: bash

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-rehearsal-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            update-performance.json
            upgrade-correctness.json
          if-no-files-found: warn

  claude-code-update:
    name: Claude Code plugin update (${{ matrix.os }})
    # Not on later pushes to a pull request: see the triggers above.
    if: github.event_name != 'pull_request' || github.event.action != 'synchronize'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      FROM_VERSION: ${{ inputs.from_version || '1.1.6' }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.296

      - name: Rehearse the previous public version upgrade in Claude Code
        shell: bash
        run: npm run release:claude-upgrade-rehearsal -- --from-version "$FROM_VERSION" --expected-version "$(node -p "require('./package.json').version")"

  windows-performance-gate:
    name: Windows five-pair update gate
    needs: marketplace-update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-rehearsal-windows-latest-*
          path: evidence
      - name: Enforce all five independent Windows pairs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha }}
        run: |
          node scripts/assert-update-performance.mjs \
            --file evidence/updater-rehearsal-windows-latest-1/update-performance.json \
            --file evidence/updater-rehearsal-windows-latest-2/update-performance.json \
            --file evidence/updater-rehearsal-windows-latest-3/update-performance.json \
            --file evidence/updater-rehearsal-windows-latest-4/update-performance.json \
            --file evidence/updater-rehearsal-windows-latest-5/update-performance.json \
            --expected-commit "$EXPECTED_COMMIT" --iterations 5 --minimum-improvement 0.2

  runtime-compatibility:
    name: Runtime compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
        node:
          - 22.12.0
          - 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || '' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run updater compatibility tests
        run: node --test --import tsx/esm tests/platform-invocation.test.ts tests/marketplace-rehearsal-config.test.ts tests/update-marketplace-runtime.test.ts tests/update-performance-assertion.test.ts tests/update-runner.test.ts
